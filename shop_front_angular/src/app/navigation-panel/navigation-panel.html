<nav aria-label="Product categories">
  @if (error()) {
    <p role="alert">Unable to load categories. Please try again later.</p>
  }
  <ul>
    @for (category of categories(); track category.name) {
      <li routerLinkActive="activated"><a [routerLink]="['/productlist', category.name]">{{ category.name }}</a></li>
    }
  </ul>
</nav>
